<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>酒教俱樂部黑卡</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{--brown-deep:#3C2A1E;--brown-light:#6E5338;--cream:#F2E8D5;--gold:#C9A14A;--gold-bright:#E8C46A;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--brown-deep);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;color:#EDE3D3;}
  .wrap{max-width:460px;margin:0 auto;padding:28px 20px 60px;}
  h1{font-size:22px;font-weight:900;text-align:center;margin:8px 0 4px;color:#FBF4E4;}
  .sub{text-align:center;font-size:13px;color:#C9BBA3;margin-bottom:24px;}
  label{display:block;font-size:13px;font-weight:700;color:var(--gold-bright);margin:16px 0 6px;}
  input[type=tel],input[type=email]{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--brown-light);background:#2E2014;color:#FBF4E4;font-size:15px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:8px 14px;border-radius:999px;border:1px solid var(--brown-light);font-size:13px;cursor:pointer;background:#2E2014;color:#EDE3D3;}
  .chip.active{background:var(--gold-bright);color:var(--brown-deep);border-color:var(--gold-bright);font-weight:700;}
  button{width:100%;margin-top:28px;padding:14px;border:none;border-radius:10px;background:var(--gold-bright);color:var(--brown-deep);font-size:16px;font-weight:900;}
  button:disabled{opacity:.5;}
  #form-view,#card-view,#loading{display:none;}
  #card-view{text-align:center;padding-top:40px;}
  .card{position:relative;width:100%;aspect-ratio:1.586;border-radius:16px;background:linear-gradient(155deg,var(--brown-light),var(--brown-deep));border:2px solid var(--gold);box-shadow:0 14px 30px -10px rgba(0,0,0,.6);display:flex;flex-direction:column;justify-content:flex-end;padding:18px;}
  .card .brand{position:absolute;top:16px;left:18px;font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--gold-bright);}
  .card .pic{width:56px;height:56px;border-radius:50%;border:2px solid var(--gold-bright);object-fit:cover;margin-bottom:8px;}
  .card .name{font-size:18px;font-weight:900;color:#FBF4E4;}
  .card .tag{font-size:12px;color:var(--gold-bright);margin-top:2px;}
  .done-msg{margin-top:24px;font-size:14px;color:#C9BBA3;line-height:1.8;}
  .spinner{margin:80px auto;width:28px;height:28px;border:3px solid var(--brown-light);border-top-color:var(--gold-bright);border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading"><div class="spinner"></div></div>
  <div id="form-view">
    <h1>酒教俱樂部黑卡</h1>
    <div class="sub">填寫以下資訊，30 秒加入免費會員</div>
    <label>聯絡電話（必填）</label>
    <input type="tel" id="phone" placeholder="09xx-xxx-xxx">
    <label>Email（選填）</label>
    <input type="email" id="email">
    <label>年齡區間（選填）</label>
    <div class="chips" id="ageRange">
      <div class="chip" data-v="18-24">18-24</div><div class="chip" data-v="25-34">25-34</div>
      <div class="chip" data-v="35-44">35-44</div><div class="chip" data-v="45-54">45-54</div>
      <div class="chip" data-v="55以上">55以上</div>
    </div>
    <label>性別（選填）</label>
    <div class="chips" id="gender">
      <div class="chip" data-v="男">男</div><div class="chip" data-v="女">女</div>
      <div class="chip" data-v="不便透露">不便透露</div>
    </div>
    <label>喜歡喝的酒（可複選）</label>
    <div class="chips" id="drinks">
      <div class="chip" data-v="威士忌">威士忌</div><div class="chip" data-v="紅酒">紅酒</div>
      <div class="chip" data-v="白酒">白酒</div><div class="chip" data-v="清酒">清酒</div>
      <div class="chip" data-v="啤酒">啤酒</div><div class="chip" data-v="調酒 Cocktail">調酒</div>
    </div>
    <label>期待的酒類活動（可複選）</label>
    <div class="chips" id="events">
      <div class="chip" data-v="品酒會">品酒會</div><div class="chip" data-v="調酒課程">調酒課程</div>
      <div class="chip" data-v="產地/酒莊導覽">產地導覽</div><div class="chip" data-v="派對社交">派對社交</div>
    </div>
    <button id="submitBtn" onclick="submitForm()">加入成為會員</button>
  </div>
  <div id="card-view">
    <div class="card">
      <div class="brand">酒教俱樂部黑卡</div>
      <img class="pic" id="cardPic" src="">
      <div class="name" id="cardName"></div>
      <div class="tag">一般會員</div>
    </div>
    <div class="done-msg">加入成功！歡迎來到酒教俱樂部，期待在品酒會上見到你。</div>
  </div>
</div>
<script>
  var LIFF_ID = "2012062363-C9NO5w27";
  var GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbx7zJ3KqW8sBsjfjUn3f-uNQkx6_zWfxtbyyUkoAYp7QUMxTIq4H_o6CaQ14fclmz4/exec";
  var profile = null;
  var selected = { drinks: [], events: [], ageRange: "", gender: "" };
  function show(id){ ["loading","form-view","card-view"].forEach(function(x){ document.getElementById(x).style.display = x===id ? "block":"none"; }); }
  show("loading");
  liff.init({ liffId: LIFF_ID }).then(function(){
    if (!liff.isLoggedIn()) { liff.login(); return; }
    return liff.getProfile();
  }).then(function(p){
    if (!p) return;
    profile = p;
    show("form-view");
  }).catch(function(err){
    document.getElementById("loading").innerHTML = "<div class=\"sub\">載入失敗，請用 LINE 打開這個連結</div>";
    show("loading");
  });
  function bindChips(containerId, store){
    document.querySelectorAll("#"+containerId+" .chip").forEach(function(el){
      el.addEventListener("click", function(){
        el.classList.toggle("active");
        var v = el.getAttribute("data-v");
        var idx = selected[store].indexOf(v);
        if (idx >= 0) selected[store].splice(idx,1); else selected[store].push(v);
      });
    });
  }
  bindChips("drinks","drinks");
  bindChips("events","events");
  function bindSingleChips(containerId, key){
    document.querySelectorAll("#"+containerId+" .chip").forEach(function(el){
      el.addEventListener("click", function(){
        document.querySelectorAll("#"+containerId+" .chip").forEach(function(o){ o.classList.remove("active"); });
        el.classList.add("active");
        selected[key] = el.getAttribute("data-v");
      });
    });
  }
  bindSingleChips("ageRange","ageRange");
  bindSingleChips("gender","gender");
  function submitForm(){
    var phone = document.getElementById("phone").value.trim();
    if (!phone) { alert("請填寫聯絡電話"); return; }
    var btn = document.getElementById("submitBtn");
    btn.disabled = true; btn.innerText = "送出中...";
    var payload = {
      lineUid: profile.userId,
      lineName: profile.displayName,
      phone: phone,
      email: document.getElementById("email").value.trim(),
      ageRange: selected.ageRange,
      gender: selected.gender,
      drinks: selected.drinks,
      events: selected.events
    };
    fetch(GAS_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); }).then(function(res){
      document.getElementById("cardPic").src = profile.pictureUrl || "";
      document.getElementById("cardName").innerText = profile.displayName;
      show("card-view");
    }).catch(function(){
      btn.disabled = false; btn.innerText = "加入成為會員";
      alert("送出失敗，請再試一次");
    });
  }
</script>
</body>
</html>
